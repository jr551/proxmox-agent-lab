name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run warning-clean tests
        env:
          PYTHONWARNINGS: error
        run: python -m unittest discover -s tests -q
      - name: Compile package and tests
        run: python -m compileall -q src tests
      - name: Scan the checkout for secrets
        run: |
          python scripts/check-secrets.py .
          python scripts/check-public.py .
      - name: Check shell syntax
        run: |
          for file in \
            bootstrap.sh install.sh proxmox-host-setup.sh \
            scripts/proxmox-lab scripts/install-watchdog \
            scripts/sync-repo
          do
            bash -n "$file"
          done

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and source archive
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/proxmox-agent-lab-smoke
          /tmp/proxmox-agent-lab-smoke/bin/pip install --no-deps dist/*.whl
          PROXMOX_AGENT_LAB_CONFIG=/tmp/missing.toml \
            /tmp/proxmox-agent-lab-smoke/bin/proxmox-lab --help >/dev/null
          /tmp/proxmox-agent-lab-smoke/bin/python -c \
            'import proxmox_agent_lab; print(proxmox_agent_lab.__version__)'
