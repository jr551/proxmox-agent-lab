name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ISO test tooling
        run: sudo apt-get update && sudo apt-get install --yes xorriso
      - name: Verify tests and public-release guards
        env:
          PYTHONWARNINGS: error
        run: |
          python -m unittest discover -s tests -q
          python scripts/check-secrets.py .
          python scripts/check-public.py .
          python -m compileall -q src tests
      - name: Verify tag, package version, and changelog
        run: |
          python scripts/check-release.py \
            --tag "$GITHUB_REF_NAME" \
            --notes-output "$RUNNER_TEMP/release-notes.md"
      - name: Build wheel and source archive
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/proxmox-agent-lab-release-smoke
          /tmp/proxmox-agent-lab-release-smoke/bin/pip install \
            --no-deps dist/*.whl
          PROXMOX_AGENT_LAB_CONFIG=/tmp/missing.toml \
            /tmp/proxmox-agent-lab-release-smoke/bin/proxmox-lab \
            --help >/dev/null
          /tmp/proxmox-agent-lab-release-smoke/bin/python -c \
            'import proxmox_agent_lab; print(proxmox_agent_lab.__version__)'
      - name: Create artifact checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
