[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxmox-agent-lab"
version = "0.23.0"
description = "A skill that gives an AI agent disposable Proxmox guests that clean up after themselves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "proxmox",
    "homelab",
    "reverse-engineering",
    "digital-forensics",
    "malware-analysis",
    "wake-on-lan",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]

# The controller is stdlib-only: the control plane is SSH and the store is
# SQLite, so a plain install needs nothing beyond Python 3.11+.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
proxmox-lab = "proxmox_agent_lab.cli:main"

[project.urls]
Homepage = "https://github.com/jr551/proxmox-agent-lab"
Documentation = "https://github.com/jr551/proxmox-agent-lab/blob/main/docs/INSTALL.md"
Issues = "https://github.com/jr551/proxmox-agent-lab/issues"
Changelog = "https://github.com/jr551/proxmox-agent-lab/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_agent_lab"]

[tool.hatch.build.targets.wheel.force-include]
".agents" = ".agents"

[tool.hatch.build.targets.sdist]
include = [
    "/.agents",
    "/src",
    "/tests",
    "/docs",
    "/agents",
    "/scripts",
    "/README.md",
    "/SKILL.md",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/RESPONSIBLE_USE.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/LICENSE",
]
