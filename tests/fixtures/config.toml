# Deterministic configuration for the test suite. Tests must never depend on
# whatever the developer happens to have installed locally.
#
# The schema is the whole schema (docs/rework-plan.md §G): these sections are
# everything the package reads.

[ssh]
target = "fixture-host"

[pve]
node = "pve"
template_vmid = 9025

[power]
mac = "aa:bb:cc:dd:ee:ff"
broadcast = "192.0.2.255"
port = 9

[state]
# Placeholder only: tests/support/bootstrap.py points PROXMOX_AGENT_LAB_STATE
# at a fresh per-process temp directory, which takes precedence.
dir = "/tmp/proxmox-agent-lab-test-state"

[lease]
ttl_seconds = 7200
idle_shutdown_seconds = 28800
